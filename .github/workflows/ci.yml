name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    shell: bash

jobs:
  line-limit:
    name: Source guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust files stay under 425 lines
        run: |
          status=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if (( lines > 425 )); then
              echo "error: $file has $lines lines (limit 425)"
              status=1
            fi
          done < <(git ls-files -z -- '*.rs')
          exit "$status"
      - name: Unsafe stays inside the cuda crate
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if grep -nE '\bunsafe\b' "$file" | grep -v 'forbid(unsafe_code)' > /dev/null; then
              echo "error: $file uses unsafe outside crates/cuda"
              status=1
            fi
          done < <(git ls-files -z -- 'crates/*.rs' ':!:crates/cuda/**')
          for root in crates/*/src/lib.rs crates/*/src/main.rs; do
            [[ -e "$root" ]] || continue
            [[ "$root" == crates/cuda/* ]] && continue
            if ! grep -q '^#!\[forbid(unsafe_code)\]' "$root"; then
              echo "error: $root is missing #![forbid(unsafe_code)]"
              status=1
            fi
          done
          exit "$status"

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-on-failure: true

      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

      - name: sccache statistics
        if: always()
        run: '"${SCCACHE_PATH}" --show-stats'
